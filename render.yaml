# Render Blueprint Specification for ApproveRail
# Sponsor Showcase: Render Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: approverail
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    preDeployCommand: pnpm db:migrate
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: approverail-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: DEV_BYPASS_PASSKEY
        value: "true"
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: ZAPIER_WEBHOOK_URL
        sync: false

databases:
  - name: approverail-db
    region: oregon
    plan: starter
    databaseName: approverail
    user: approverail_user
