# Render Blueprint Specification for ApproveRail
# Blueprint Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: approverail
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    preDeployCommand: pnpm db:migrate
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: approverail-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: ApproveRail
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_BASE_URL
        value: https://api.channel3.ai
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false

databases:
  - name: approverail-db
    region: oregon
    plan: starter
    databaseName: approverail
    user: approverail_user
